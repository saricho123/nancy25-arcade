<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flute Face-Off — Nancy's 25th</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="flute-bgm" src="flute.m4a" loop preload="auto"></audio>
<script>
  (function(){
    const bgm = document.getElementById('flute-bgm');
    bgm.volume = 0.55;
    const tryPlay = () => bgm.play().catch(()=>{});
    tryPlay();
    const onGesture = () => { tryPlay(); document.removeEventListener('pointerdown', onGesture); document.removeEventListener('keydown', onGesture); };
    document.addEventListener('pointerdown', onGesture);
    document.addEventListener('keydown', onGesture);
  })();
</script>

<div id="scene">
  <div id="cab-lid"><div id="lid-shine"></div></div>
  <div id="cab">
    <div class="cab-side left"><div class="side-stripe"></div></div>
    <div id="cab-face">

      <div id="marquee-wrap">
        <div id="marquee-rainbow"></div>
        <div id="marquee-text">♩ FLUTE FACE-OFF ♪</div>
        <div id="marquee-sub">✦ NANKY'S 25TH ✦</div>
        <div class="bolt tl"></div><div class="bolt tr"></div>
        <div class="bolt bl"></div><div class="bolt br"></div>
      </div>

      <div id="speaker-bar">
        <div class="grille"></div>
        <div id="brand-plate">25¢ · ARCADE · 25¢</div>
        <div class="grille"></div>
      </div>

      <div id="monitor-housing">
        <div id="monitor-bezel">
          <div id="screen-area">
            <canvas id="canvas"></canvas>

            <div id="start-overlay" class="overlay">
              <div class="overlay-icon">♩</div>
              <h1>FLUTE FACE-OFF</h1>
              <div class="price-badge">25¢ TO PLAY</div>
              <p>Whack the opps — spare the friends!<br>3 lives · 60 seconds · gets faster!</p>
              <button id="play-btn">INSERT QUARTER ⬤</button>
            </div>

            <div id="end-overlay" class="overlay hidden">
              <h1 id="end-title">TIME'S UP!</h1>
              <p id="end-score" class="end-score-line"></p>
              <p id="end-msg" class="bday-note"></p>
              <button id="replay-btn">PLAY AGAIN</button>
              <button id="back-btn">← ARCADE</button>
            </div>
          </div>
        </div>
      </div>

      <div id="ctrl-panel">
        <div id="ctrl-inner">
          <div class="screw sl"></div><div class="screw sr"></div>
          <div id="hud-row">
            <span>SCORE <span id="score-disp">0</span></span>
            <span id="lives-disp">♩ ♩ ♩</span>
          </div>
          <div id="real-btns">
            <button id="menu-btn">↺ MENU</button>
            <button id="back-btn2">← ARCADE</button>
          </div>
          <div id="deco-controls">
            <div id="joystick-assy"><div id="j-base"></div><div id="j-shaft"></div><div id="j-ball"></div></div>
            <div id="p1-start">1P START</div>
            <div id="action-assy">
              <div class="a-btn" id="btn-red"></div>
              <div class="a-btn" id="btn-blue"></div>
              <div class="a-btn" id="btn-yellow"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="coin-door">
        <div id="coin-door-panel">
          <div class="quarter-slot-row">
            <div class="q-slot"><span>25¢</span></div>
            <div class="q-slot"><span>25¢</span></div>
          </div>
          <div id="coin-door-label">INSERT QUARTER — 25¢ PER PLAY</div>
          <div id="coin-return">COIN RETURN</div>
        </div>
      </div>
      <div id="kickplate"><span id="kickplate-text">FLUTE FACE-OFF © 25¢</span></div>
    </div>
    <div class="cab-side right"><div class="side-stripe"></div></div>
  </div>
  <div id="floor-glow"></div>
</div>

<script src="game-v2.js"></script>
</body>
</html>
