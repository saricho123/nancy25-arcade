<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quarter Century Arcade — Nancy's 25th</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub.css">
  <script src="three.min.js"></script>
</head>
<body>

  <!-- ══ CANVAS element (Three.js renders into this) ══ -->
  <canvas id="room-canvas" aria-hidden="true"></canvas>

  <!-- ══ THREE.JS 3D ARCADE ROOM ══ -->
  <script>
  (function() {
    if(typeof THREE==='undefined') return;
    const canvas = document.getElementById('room-canvas');
    if(!canvas) return;
    canvas.style.zIndex = '2';

    /* ── Renderer ── */
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06020e);
    scene.fog = new THREE.Fog(0x080218, 32, 75);

    const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 12);

    /* ── Lights ── */
    scene.add(new THREE.HemisphereLight(0x6644bb, 0x220044, 1.8));
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(6,10,4); key.castShadow=true; scene.add(key);

    const RW=30, RH=8, RD=46;

    function addPlane(w,h,col,rx,ry,x,y,z){
      const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
        new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide}));
      m.rotation.x=rx; m.rotation.y=ry; m.position.set(x,y,z);
      m.receiveShadow=true; scene.add(m);
    }
    addPlane(RW,RD,0x0c0440,-Math.PI/2,0,0,0,0);
    addPlane(RW,RD,0x040118, Math.PI/2,0,0,RH,0);
    addPlane(RW,RH,0x090330,0,0,0,RH/2,-RD/2);
    addPlane(RD,RH,0x060225,0,Math.PI/2,-RW/2,RH/2,0);
    addPlane(RD,RH,0x060225,0,-Math.PI/2,RW/2,RH/2,0);

    const grid=new THREE.GridHelper(RD,36,0x5500cc,0x280077);
    grid.position.y=0.02; scene.add(grid);

    [-RW/2,RW/2].forEach(x=>{
      const s=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.07,RD),
        new THREE.MeshBasicMaterial({color:0x7700ff}));
      s.position.set(x,0.04,0); scene.add(s);
      const pt=new THREE.PointLight(0x6600ee,1.5,10); pt.position.set(x,0.7,0); scene.add(pt);
    });

    [[-8,-12],[0,-3],[8,7]].forEach(([x,z])=>{
      const f=new THREE.Mesh(new THREE.BoxGeometry(3.5,0.07,0.18),
        new THREE.MeshBasicMaterial({color:0xeeeeff}));
      f.position.set(x,RH-0.08,z); scene.add(f);
      const pt=new THREE.PointLight(0xddd8ff,7,22); pt.position.set(x,RH-0.3,z); pt.castShadow=true; scene.add(pt);
    });

    const sgn=new THREE.Mesh(new THREE.BoxGeometry(11,1.4,0.08),
      new THREE.MeshBasicMaterial({color:0xcc44ff}));
    sgn.position.set(0,5.8,-RD/2+0.1); scene.add(sgn);
    const sgnL=new THREE.PointLight(0xcc44ff,5,18); sgnL.position.set(0,5.8,-RD/2+1.5); scene.add(sgnL);

    const db=new THREE.Mesh(new THREE.SphereGeometry(0.5,14,14),
      new THREE.MeshLambertMaterial({color:0xffffff,emissive:0xaaaaaa}));
    db.position.set(0,RH-0.9,0); scene.add(db);
    const dbl=new THREE.PointLight(0xffffff,3,22); scene.add(dbl);

    function addWallMon(x,z,ry,col){
      const g=new THREE.Group();
      g.add(new THREE.Mesh(new THREE.BoxGeometry(2,1.25,0.1),
        new THREE.MeshLambertMaterial({color:0x0a0820})));
      const scr=new THREE.Mesh(new THREE.PlaneGeometry(1.75,1.05),
        new THREE.MeshBasicMaterial({color:col}));
      scr.position.set(0,0,0.06); g.add(scr);
      const pl=new THREE.PointLight(col,2,7); pl.position.set(0,0,0.7); g.add(pl);
      g.position.set(x,3.8,z); g.rotation.y=ry; scene.add(g);
    }
    addWallMon(-RW/2+0.1,-12, Math.PI/2,0x22ee55);
    addWallMon(-RW/2+0.1,  2, Math.PI/2,0x2299ff);
    addWallMon( RW/2-0.1,-14,-Math.PI/2,0xff2255);
    addWallMon( RW/2-0.1,  1,-Math.PI/2,0xeecc11);

    function addVend(x,z,ry,col){
      const g=new THREE.Group();
      g.add(new THREE.Mesh(new THREE.BoxGeometry(0.85,2.1,0.55),
        new THREE.MeshLambertMaterial({color:0x141230})));
      const gl=new THREE.Mesh(new THREE.PlaneGeometry(0.62,1.28),
        new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.65}));
      gl.position.set(0,0.1,0.28); g.add(gl);
      const pl=new THREE.PointLight(col,1.5,4); pl.position.set(0,0,0.6); g.add(pl);
      g.position.set(x,1.05,z); g.rotation.y=ry; scene.add(g);
    }
    addVend(-RW/2+0.5,-18,Math.PI/2,0x44ff88);
    addVend(-RW/2+0.5, -6,Math.PI/2,0x4499ff);
    addVend( RW/2-0.5,-16,-Math.PI/2,0xff44aa);
    addVend( RW/2-0.5, -5,-Math.PI/2,0xff8822);

    /* ════════════════════════════════════════════════════
       SCREEN TEXTURES — drawn on canvas, one per game
       ════════════════════════════════════════════════════ */
    function makeScreenTexture(idx) {
      const C = document.createElement('canvas');
      C.width = 256; C.height = 200;
      const cx = C.getContext('2d');

      if (idx === 0) {
        // Sheep Escape — green field, white sheep blobs
        const g = cx.createLinearGradient(0,0,0,200);
        g.addColorStop(0,'#72c257'); g.addColorStop(1,'#3d8a2a');
        cx.fillStyle=g; cx.fillRect(0,0,256,200);
        // grass
        cx.fillStyle='#2d6a1f'; cx.fillRect(0,150,256,50);
        // sheep
        [[40,110],[110,90],[175,115],[55,145],[145,140]].forEach(([x,y])=>{
          cx.fillStyle='#f0efe7';
          cx.beginPath(); cx.ellipse(x,y,20,14,0,0,Math.PI*2); cx.fill();
          cx.fillStyle='#e2e1d8';
          cx.beginPath(); cx.ellipse(x-6,y-10,13,10,0,0,Math.PI*2); cx.fill();
          cx.fillStyle='#5c3d28';
          cx.beginPath(); cx.arc(x+18,y,9,0,Math.PI*2); cx.fill();
          // party hat
          cx.fillStyle=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#cc5de8'][Math.floor(x/40)%5];
          cx.beginPath(); cx.moveTo(x+12,y-9); cx.lineTo(x+22,y-24); cx.lineTo(x+32,y-9); cx.closePath(); cx.fill();
        });
        cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(0,0,256,32);
        cx.fillStyle='#fff'; cx.font='bold 14px monospace'; cx.textAlign='center';
        cx.fillText('SHEEP ESCAPE',128,22);

      } else if (idx === 1) {
        // Fear of Flying — sky, clouds, plane
        const sg = cx.createLinearGradient(0,0,0,200);
        sg.addColorStop(0,'#1255a0'); sg.addColorStop(1,'#a8dff2');
        cx.fillStyle=sg; cx.fillRect(0,0,256,200);
        // clouds
        [[50,55,40],[160,35,35],[210,75,30],[100,80,25]].forEach(([x,y,r])=>{
          cx.fillStyle='rgba(255,255,255,0.82)';
          cx.beginPath(); cx.arc(x,y,r,0,Math.PI*2); cx.fill();
          cx.beginPath(); cx.arc(x-r*.6,y+r*.4,r*.65,0,Math.PI*2); cx.fill();
          cx.beginPath(); cx.arc(x+r*.6,y+r*.4,r*.65,0,Math.PI*2); cx.fill();
        });
        // turbulence zones
        cx.fillStyle='rgba(200,70,10,0.55)';
        cx.fillRect(180,30,40,90); cx.fillRect(30,100,35,80);
        cx.fillStyle='rgba(255,220,40,0.7)';
        cx.font='bold 20px sans-serif'; cx.textAlign='center';
        cx.fillText('⚡',200,80); cx.fillText('⚡',47,145);
        // plane
        cx.fillStyle='#f4f6fb';
        cx.beginPath(); cx.ellipse(128,130,50,16,0,0,Math.PI*2); cx.fill();
        cx.fillStyle='#1565c0'; cx.fillRect(115,122,26,8);
        cx.beginPath(); cx.moveTo(165,130); cx.quadraticCurveTo(180,130,170,140); cx.closePath(); cx.fill();
        cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(0,0,256,32);
        cx.fillStyle='#fff'; cx.font='bold 12px monospace'; cx.textAlign='center';
        cx.fillText('FEAR OF FLYING',128,22);

      } else if (idx === 2) {
        // Wheeler Climb — night brick building + fire escape
        cx.fillStyle='#020810'; cx.fillRect(0,0,256,200);
        // stars
        [[20,18],[80,10],[150,25],[200,15],[230,40],[50,40],[120,8]].forEach(([x,y])=>{
          cx.fillStyle='rgba(255,255,220,0.7)'; cx.fillRect(x,y,2,2);
        });
        // building
        const brickPal=['#9a3c28','#8b3320','#a04030'];
        for(let r=0;r<8;r++){
          for(let c=0;c<7;c++){
            cx.fillStyle=brickPal[(r*3+c)%3];
            const bx=20+(c*(30+(r%2?0:15)))+((r%2)*15);
            const by=70+r*16;
            if(bx<236) cx.fillRect(bx,by,28,13);
          }
        }
        // windows
        [[50,80],[100,80],[150,80],[50,110],[100,110],[150,110]].forEach(([x,y])=>{
          cx.fillStyle='rgba(255,220,100,0.7)'; cx.fillRect(x,y,22,18);
          cx.strokeStyle='#c8b090'; cx.lineWidth=1; cx.strokeRect(x,y,22,18);
        });
        // fire escape
        cx.strokeStyle='#1a1a1a'; cx.lineWidth=3;
        cx.beginPath(); cx.moveTo(185,70); cx.lineTo(185,200); cx.stroke();
        cx.beginPath(); cx.moveTo(200,70); cx.lineTo(200,200); cx.stroke();
        for(let i=0;i<8;i++){ cx.beginPath(); cx.moveTo(185,78+i*16); cx.lineTo(200,78+i*16); cx.stroke(); }
        cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(0,0,256,32);
        cx.fillStyle='#f4d03f'; cx.font='bold 11px monospace'; cx.textAlign='center';
        cx.fillText('CLIMBING UP WHEELER',128,22);

      } else if (idx === 3) {
        // Chutes & Memories — parchment board with snakes + ladders
        cx.fillStyle='#f5edd8'; cx.fillRect(0,0,256,200);
        // grid
        const sq=36;
        for(let r=0;r<5;r++) for(let c=0;c<5;c++){
          const colors=['#fff9e0','#e6f4ff','#ffe6f0','#e8ffe8','#f4e6ff'];
          cx.fillStyle=colors[(r*5+c)%5];
          cx.fillRect(8+c*sq, 8+r*sq, sq-2, sq-2);
          cx.strokeStyle='rgba(120,90,50,.3)'; cx.lineWidth=0.5;
          cx.strokeRect(8+c*sq,8+r*sq,sq-2,sq-2);
          cx.fillStyle='rgba(80,60,30,.5)'; cx.font='10px monospace'; cx.textAlign='center';
          cx.fillText(r*5+c+1, 8+c*sq+sq/2, 8+r*sq+sq*.65);
        }
        // snake
        cx.strokeStyle='rgba(200,80,10,.8)'; cx.lineWidth=4; cx.lineCap='round';
        cx.beginPath(); cx.moveTo(44,44); cx.quadraticCurveTo(90,10,170,80); cx.stroke();
        // ladder
        cx.strokeStyle='rgba(30,140,30,.7)'; cx.lineWidth=2.5;
        cx.beginPath(); cx.moveTo(152,188); cx.lineTo(80,80); cx.stroke();
        cx.beginPath(); cx.moveTo(170,188); cx.lineTo(98,80); cx.stroke();
        for(let i=0;i<5;i++){ cx.beginPath(); cx.moveTo(152+i*3.6,188-i*21.6); cx.lineTo(170+i*3.6,188-i*21.6); cx.stroke(); }
        // token
        cx.fillStyle='#f8d060'; cx.beginPath(); cx.arc(44,152,10,0,Math.PI*2); cx.fill();
        cx.fillStyle='#4a2e00'; cx.font='bold 10px monospace'; cx.textAlign='center';
        cx.fillText('N',44,156);
        cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(0,0,256,32);
        cx.fillStyle='#7b1fa2'; cx.font='bold 11px monospace'; cx.textAlign='center';
        cx.fillText('CHUTES & MEMORIES',128,22);

      } else {
        // Coming Soon — mystery screen
        cx.fillStyle='#030210'; cx.fillRect(0,0,256,200);
        // stars
        for(let i=0;i<40;i++){
          cx.fillStyle=`rgba(255,255,220,${Math.random()*.8+.2})`;
          cx.fillRect(Math.random()*256,Math.random()*200,1,1);
        }
        cx.fillStyle='rgba(200,60,220,.3)';
        cx.beginPath(); cx.arc(128,100,60,0,Math.PI*2); cx.fill();
        cx.fillStyle='rgba(200,60,220,.15)';
        cx.beginPath(); cx.arc(128,100,80,0,Math.PI*2); cx.fill();
        cx.fillStyle='#cc44ff'; cx.font='bold 48px monospace'; cx.textAlign='center';
        cx.fillText('?',128,120);
        cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(0,0,256,32);
        cx.fillStyle='#ff88ee'; cx.font='bold 11px monospace'; cx.textAlign='center';
        cx.fillText('COMING SOON',128,22);
      }

      return new THREE.CanvasTexture(C);
    }

    /* ════════════════════════════════════════════════════
       5 GAME MACHINES — position + game data bundled together
       ════════════════════════════════════════════════════ */
    const GAME_DATA = [
      {url:'game/index.html',  name:'SHEEP ESCAPE',      x:-8.5, z:-3,  body:0x0e2a0c, screen:0x22ee55, marq:0x1a6620, accent:0x44ff88},
      {url:'game2/index.html', name:'FEAR OF FLYING',    x:-4.0, z:-6,  body:0x081830, screen:0x2299ff, marq:0x0a3060, accent:0x55aaff},
      {url:'game3/index.html', name:'WHEELER CLIMB',     x: 0.0, z:-7,  body:0x2a0a04, screen:0xff4422, marq:0x601808, accent:0xff6644},
      {url:'game4/index.html', name:'CHUTES & MEMORIES', x: 4.0, z:-6,  body:0x181006, screen:0xeecc11, marq:0x402c00, accent:0xffdd44},
      {url:null,               name:'COMING SOON',       x: 8.5, z:-3,  body:0x1e0428, screen:0xff44cc, marq:0x501040, accent:0xff88ee},
    ];

    function addGameMachine({x,z,body,screen,marq,accent}, idx) {
      const g=new THREE.Group(), W=1.3, H=3.0, D=0.72;

      [-W/2-0.02,W/2+0.02].forEach(sx=>{
        const side=new THREE.Mesh(new THREE.BoxGeometry(0.06,H,D+0.04),
          new THREE.MeshLambertMaterial({color:body}));
        side.position.set(sx,0,0);  // fixed: use .set() not Object.assign
        g.add(side);
        const stripe=new THREE.Mesh(new THREE.BoxGeometry(0.02,H*0.55,0.02),
          new THREE.MeshBasicMaterial({color:accent}));
        stripe.position.set(sx,H*0.1,0); g.add(stripe);
      });

      const cab=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),
        new THREE.MeshLambertMaterial({color:body}));
      cab.castShadow=true; cab.receiveShadow=true; g.add(cab);

      const mq=new THREE.Mesh(new THREE.BoxGeometry(W*0.95,H*0.14,0.06),
        new THREE.MeshBasicMaterial({color:marq}));
      mq.position.set(0,H*0.43,D/2+0.01); g.add(mq);
      const ml=new THREE.PointLight(screen,1.2,3);
      ml.position.set(0,H*0.43,D/2+0.5); g.add(ml);

      const bezel=new THREE.Mesh(new THREE.BoxGeometry(W*0.88,H*0.40,0.04),
        new THREE.MeshLambertMaterial({color:0x050510}));
      bezel.position.set(0,H*0.10,D/2+0.025); g.add(bezel);

      const scrTex = makeScreenTexture(idx);
      scrTex.needsUpdate = true;
      const scrMesh=new THREE.Mesh(new THREE.PlaneGeometry(W*0.76,H*0.34),
        new THREE.MeshBasicMaterial({map:scrTex, side:THREE.FrontSide}));
      scrMesh.position.set(0,H*0.10,D/2+0.04); g.add(scrMesh);
      const sl=new THREE.PointLight(screen,2.2,5);
      sl.position.set(0,H*0.10,D/2+0.6); g.add(sl);

      const grille=new THREE.Mesh(new THREE.BoxGeometry(W*0.55,H*0.07,0.02),
        new THREE.MeshLambertMaterial({color:0x0a0820}));
      grille.position.set(0,H*0.35,D/2+0.01); g.add(grille);

      const cp=new THREE.Mesh(new THREE.BoxGeometry(W*0.90,H*0.09,D*0.45),
        new THREE.MeshLambertMaterial({color:0x0e0c22}));
      cp.rotation.x=-0.35; cp.position.set(0,-H*0.26,D*0.38); g.add(cp);

      // Coin slot (the interactive bit)
      const coinSlot=new THREE.Mesh(new THREE.BoxGeometry(W*0.26,0.03,0.03),
        new THREE.MeshBasicMaterial({color:0x060618}));
      coinSlot.position.set(0,-H*0.37,D/2+0.025); g.add(coinSlot);

      const kick=new THREE.Mesh(new THREE.BoxGeometry(W,H*0.05,D+0.02),
        new THREE.MeshBasicMaterial({color:accent}));
      kick.position.set(0,-H*0.485,0); g.add(kick);

      g.position.set(x, H/2, z);
      scene.add(g);
    }
    GAME_DATA.forEach((g,i) => addGameMachine(g,i));

    /* ════════════════════════════════════════════════════
       COIN SYSTEM
       ════════════════════════════════════════════════════ */
    let coins = 5;
    let nearIdx = -1;

    // Lazy getters — elements are added AFTER this script tag in the DOM
    const el = id => document.getElementById(id);

    function updateCoinDisplay() {
      const n = el('coin-count-num'); if(n) n.textContent = coins;
      const b = el('prompt-btn');     if(b) b.disabled = (coins <= 0);
      const x = el('prompt-no-coins');if(x) x.style.display = coins <= 0 ? 'block' : 'none';
    }

    function checkProximity() {
      let closest=-1, closestDist=Infinity;
      GAME_DATA.forEach((g,i)=>{
        const dx=camera.position.x-g.x, dz=camera.position.z-g.z;
        const d=Math.sqrt(dx*dx+dz*dz);
        if(d<5.5 && d<closestDist){ closest=i; closestDist=d; }
      });
      if(closest===nearIdx) return;
      nearIdx=closest;
      const promptEl = el('machine-prompt');
      if(!promptEl) return;
      if(closest<0){
        promptEl.classList.remove('visible');
      } else {
        const g=GAME_DATA[closest];
        const pn=el('prompt-game-name'); if(pn) pn.textContent=g.name;
        const ps=el('prompt-sub');       if(ps) ps.textContent=g.url?'Press [E] or click to play':'Not yet available';
        updateCoinDisplay();
        promptEl.classList.add('visible');
      }
    }

    function insertCoin() {
      if(nearIdx<0) return;
      const g=GAME_DATA[nearIdx];
      if(!g.url){ flashMessage('COMING SOON!'); return; }
      if(coins<=0){ flashMessage('NO QUARTERS!'); return; }

      coins--;
      updateCoinDisplay();

      const fadeEl=el('coin-fade'), overlayEl=el('game-overlay'), frameEl=el('game-frame');
      if(fadeEl) fadeEl.classList.add('fading');
      setTimeout(()=>{
        if(overlayEl) overlayEl.classList.add('active');
        if(frameEl)   frameEl.src=g.url;
        setTimeout(()=>{ if(fadeEl) fadeEl.classList.remove('fading'); }, 300);
      }, 350);
    }

    function exitGame() {
      const fadeEl=el('coin-fade'), overlayEl=el('game-overlay'), frameEl=el('game-frame');
      if(fadeEl) fadeEl.classList.add('fading');
      setTimeout(()=>{
        if(overlayEl) overlayEl.classList.remove('active');
        if(frameEl)   frameEl.src='';
        setTimeout(()=>{ if(fadeEl) fadeEl.classList.remove('fading'); }, 300);
      }, 350);
    }

    function flashMessage(msg) {
      if(!promptNone) return;
      promptNone.textContent=msg; promptNone.style.display='block';
      setTimeout(()=>{ promptNone.style.display='none'; }, 2000);
    }

    // Wire up buttons after DOM is fully ready
    window.addEventListener('DOMContentLoaded', ()=>{
      const pb=el('prompt-btn'); if(pb) pb.addEventListener('click', insertCoin);
      const eb=el('exit-game-btn'); if(eb) eb.addEventListener('click', exitGame);
      const fr=el('game-frame');
      if(fr) fr.addEventListener('load',()=>{
        try {
          const url=fr.contentWindow.location.href;
          const ov=el('game-overlay');
          if(url&&(url.endsWith('index.html')||url.endsWith('/'))&&ov&&ov.classList.contains('active')) exitGame();
        } catch(e){}
      });
    });
    // Also wire immediately in case DOMContentLoaded already fired
    setTimeout(()=>{
      const pb=el('prompt-btn'); if(pb && !pb._wired){ pb.addEventListener('click',insertCoin); pb._wired=true; }
      const eb=el('exit-game-btn'); if(eb && !eb._wired){ eb.addEventListener('click',exitGame); eb._wired=true; }
    }, 200);

    /* ── Camera controls ── */
    let rotY=0, rotX=0, drag=false, lx=0, ly=0;
    const keys={};

    function applyRot(){ camera.rotation.order='YXZ'; camera.rotation.y=rotY; camera.rotation.x=rotX; }

    canvas.style.cursor='grab';
    canvas.addEventListener('mousedown',e=>{ if(e.target!==canvas)return; drag=true; lx=e.clientX; ly=e.clientY; canvas.style.cursor='grabbing'; });
    window.addEventListener('mouseup',()=>{ drag=false; canvas.style.cursor='grab'; });
    window.addEventListener('mousemove',e=>{ if(!drag)return; rotY-=(e.clientX-lx)*0.004; rotX=Math.max(-0.7,Math.min(0.6,rotX-(e.clientY-ly)*0.003)); lx=e.clientX; ly=e.clientY; applyRot(); });

    canvas.addEventListener('touchstart',e=>{ lx=e.touches[0].clientX; ly=e.touches[0].clientY; },{passive:true});
    canvas.addEventListener('touchmove',e=>{ e.preventDefault(); rotY-=(e.touches[0].clientX-lx)*0.004; rotX=Math.max(-0.7,Math.min(0.6,rotX-(e.touches[0].clientY-ly)*0.003)); lx=e.touches[0].clientX; ly=e.touches[0].clientY; applyRot(); },{passive:false});

    window.addEventListener('keydown',e=>{
      keys[e.key]=true;
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
      if(e.key==='e'||e.key==='E') insertCoin();
      if(e.key==='Escape' && overlayEl&&overlayEl.classList.contains('active')) exitGame();
    });
    window.addEventListener('keyup',e=>keys[e.key]=false);

    const SPEED=0.10;
    function handleMovement(){
      if(overlayEl&&overlayEl.classList.contains('active')) return; // freeze while game is open
      const fwd=new THREE.Vector3(-Math.sin(rotY),0,-Math.cos(rotY));
      const rgt=new THREE.Vector3( Math.cos(rotY),0,-Math.sin(rotY));
      if(keys['w']||keys['W']) camera.position.addScaledVector(fwd, SPEED);
      if(keys['s']||keys['S']) camera.position.addScaledVector(fwd,-SPEED);
      if(keys['a']||keys['A']) camera.position.addScaledVector(rgt,-SPEED);
      if(keys['d']||keys['D']) camera.position.addScaledVector(rgt, SPEED);
      if(keys['ArrowLeft'])  rotY+=0.025;
      if(keys['ArrowRight']) rotY-=0.025;
      if(keys['ArrowUp'])    rotX=Math.max(-0.7,Math.min(0.6,rotX+0.018));
      if(keys['ArrowDown'])  rotX=Math.max(-0.7,Math.min(0.6,rotX-0.018));
      applyRot();
      camera.position.x=Math.max(-RW/2+1,Math.min(RW/2-1,camera.position.x));
      camera.position.z=Math.max(-RD/2+1,Math.min(RD/2-1,camera.position.z));
      camera.position.y=2.5;
    }

    window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

    // Controls hint
    const hint=document.createElement('div');
    hint.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;color:rgba(190,160,255,.55);font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:2px;pointer-events:none;white-space:nowrap;';
    hint.innerHTML='WASD walk &nbsp;|&nbsp; DRAG / ← → ↑ ↓ look &nbsp;|&nbsp; [E] insert coin';
    document.body.appendChild(hint);
    setTimeout(()=>{ hint.style.transition='opacity 2s'; hint.style.opacity='0'; },10000);

    /* ── Live debug overlay ── */
    const dbg = document.createElement('div');
    dbg.style.cssText='position:fixed;top:50px;left:8px;z-index:999999;background:rgba(0,0,0,.88);color:#0f0;font:10px monospace;padding:8px;border:1px solid #0f0;pointer-events:none;min-width:280px;line-height:1.6';
    document.body.appendChild(dbg);
    window.addEventListener('error',e=>{ dbg.innerHTML+='<br><span style="color:#f44">ERR: '+e.message+'</span>'; });

    let t=0;
    (function loop(){
      requestAnimationFrame(loop); t+=0.016;
      handleMovement();
      checkProximity();  // every frame so prompt appears even when standing still
      db.rotation.y=t*0.6;
      dbl.position.set(Math.sin(t*0.55)*10,RH-1.5,Math.cos(t*0.55)*7);
      dbl.color.setHSL((t*0.07)%1,1,0.65);
      renderer.render(scene,camera);

      // Update debug every 20 frames
      if(Math.round(t*60)%20===0){
        const px=camera.position.x.toFixed(1), py=camera.position.y.toFixed(1), pz=camera.position.z.toFixed(1);
        let html='<b>CAM</b> x:'+px+' y:'+py+' z:'+pz+'<br>';
        html+='<b>nearIdx:</b> '+nearIdx+'<br>';
        html+='<b>promptEl:</b> '+(promptEl?'found':'NULL')+'<br>';
        html+='<b>prompt.class:</b> '+(promptEl?promptEl.className:'—')+'<br>';
        html+='<b>GAME_DATA distances:</b><br>';
        GAME_DATA.forEach((g,i)=>{
          const d=Math.sqrt((camera.position.x-g.x)**2+(camera.position.z-g.z)**2);
          html+='  ['+i+'] '+g.name.substring(0,14)+' d='+d.toFixed(2)+'<br>';
        });
        html+='<b>scrTex test:</b> ';
        try{ const tx=makeScreenTexture(0); html+=(tx?'ok ('+tx.image.width+'px)':'null'); }catch(e){ html+='ERR:'+e.message; }
        dbg.innerHTML=html;
      }
    })();
  })();
  </script>



  <!-- ══ COIN BAR ══ -->

    <div id="arcade-room-label">QUARTER CENTURY ARCADE</div>
    <div id="coin-display">
      <div class="hud-coin">25¢</div>
      <span id="coin-count-num">5</span>
      <span id="coin-label">QUARTERS</span>
    </div>
  </div>

  <!-- ══ MACHINE PROXIMITY PROMPT ══ -->
  <div id="machine-prompt">
    <div id="prompt-game-name">SHEEP ESCAPE</div>
    <div id="prompt-sub">Walk up to the machine</div>
    <button id="prompt-btn">INSERT QUARTER [E]</button>
    <div id="prompt-no-coins">NO QUARTERS LEFT!</div>
  </div>

  <!-- ══ FADE OVERLAY (coin insert transition) ══ -->
  <div id="coin-fade"></div>

  <!-- ══ GAME OVERLAY (fullscreen iframe) ══ -->
  <div id="game-overlay">
    <iframe id="game-frame" src="" allowfullscreen></iframe>
    <button id="exit-game-btn">← BACK TO ARCADE</button>
  </div>

</body>
