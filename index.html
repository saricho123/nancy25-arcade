<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quarter Century Arcade — Nancy's 25th</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub.css">
  <script src="three.min.js"></script>
</head>
<body>

  <!-- ══ BACKGROUND MUSIC ══ -->
  <audio id="bgm" loop preload="auto">
    <source src="Mastered-Final_TESLA TUFF.m4a" type="audio/mp4">
  </audio>
  <button id="mute-btn" title="Toggle music">🔊</button>
  <style>
    #mute-btn {
      position: fixed;
      top: 12px;
      right: 14px;
      z-index: 9999;
      background: rgba(20,5,30,0.82);
      border: 1px solid rgba(180,80,200,0.5);
      border-radius: 8px;
      color: #fff;
      font-size: 20px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1;
    }
    #mute-btn:hover { background: rgba(40,10,60,0.95); border-color: rgba(220,100,255,0.8); }
  </style>
  <script>
    (function(){
      const bgm = document.getElementById('bgm');
      const btn = document.getElementById('mute-btn');
      bgm.volume = 0.55;
      // Try immediate autoplay
      const tryPlay = () => bgm.play().catch(()=>{});
      tryPlay();
      // Browsers often block autoplay until first gesture — catch that too
      const onGesture = () => { tryPlay(); document.removeEventListener('pointerdown', onGesture); document.removeEventListener('keydown', onGesture); };
      document.addEventListener('pointerdown', onGesture);
      document.addEventListener('keydown', onGesture);
      // Mute toggle
      btn.addEventListener('click', e => {
        e.stopPropagation();
        bgm.muted = !bgm.muted;
        btn.textContent = bgm.muted ? '🔇' : '🔊';
      });
    })();
  </script>

  <!-- ══ CANVAS element (Three.js renders into this) ══ -->
  <canvas id="room-canvas" aria-hidden="true"></canvas>

  <!-- ══ THREE.JS 3D ARCADE ROOM ══ -->
  <script>
  (function() {
    // Catch any JS errors and show them on screen
    if(typeof THREE==='undefined') return;
    const canvas = document.getElementById('room-canvas');
    if(!canvas) return;
    canvas.style.zIndex = '2';

    /* ── Renderer ── */
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06020e);
    scene.fog = new THREE.Fog(0x080218, 32, 75);

    const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 12);

    /* ── Lights ── */
    scene.add(new THREE.HemisphereLight(0x6644bb, 0x220044, 1.8));
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(6,10,4); key.castShadow=true; scene.add(key);

    const RW=30, RH=8, RD=46;

    function addPlane(w,h,col,rx,ry,x,y,z){
      const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
        new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide}));
      m.rotation.x=rx; m.rotation.y=ry; m.position.set(x,y,z);
      m.receiveShadow=true; scene.add(m);
    }
    addPlane(RW,RD,0x0c0440,-Math.PI/2,0,0,0,0);
    addPlane(RW,RD,0x040118, Math.PI/2,0,0,RH,0);
    addPlane(RW,RH,0x090330,0,0,0,RH/2,-RD/2);
    addPlane(RD,RH,0x060225,0,Math.PI/2,-RW/2,RH/2,0);
    addPlane(RD,RH,0x060225,0,-Math.PI/2,RW/2,RH/2,0);

    const grid=new THREE.GridHelper(RD,36,0x5500cc,0x280077);
    grid.position.y=0.02; scene.add(grid);

    [-RW/2,RW/2].forEach(x=>{
      const s=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.07,RD),
        new THREE.MeshBasicMaterial({color:0x7700ff}));
      s.position.set(x,0.04,0); scene.add(s);
      const pt=new THREE.PointLight(0x6600ee,1.5,10); pt.position.set(x,0.7,0); scene.add(pt);
    });

    [[-8,-12],[0,-3],[8,7]].forEach(([x,z])=>{
      const f=new THREE.Mesh(new THREE.BoxGeometry(3.5,0.07,0.18),
        new THREE.MeshBasicMaterial({color:0xeeeeff}));
      f.position.set(x,RH-0.08,z); scene.add(f);
      const pt=new THREE.PointLight(0xddd8ff,7,22); pt.position.set(x,RH-0.3,z); pt.castShadow=true; scene.add(pt);
    });

    const sgn=new THREE.Mesh(new THREE.BoxGeometry(11,1.4,0.08),
      new THREE.MeshBasicMaterial({color:0xcc44ff}));
    sgn.position.set(0,5.8,-RD/2+0.1); scene.add(sgn);
    const sgnL=new THREE.PointLight(0xcc44ff,5,18); sgnL.position.set(0,5.8,-RD/2+1.5); scene.add(sgnL);

    /* ═══ MIRROR DISCO BALL — silver tiles, rotating ═══ */
    const db=new THREE.Group(); db.position.set(0,RH-1.2,0); scene.add(db);
    // Dark base sphere (fills gaps between tiles)
    db.add(new THREE.Mesh(new THREE.SphereGeometry(1.05,24,24),
      new THREE.MeshStandardMaterial({color:0x111118,metalness:0.4,roughness:0.6})));
    // Hanging rod
    const dbRod=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.1,8),
      new THREE.MeshStandardMaterial({color:0x888899,metalness:0.8,roughness:0.2}));
    dbRod.position.set(0,RH-0.5-(-1.2),0); scene.add(dbRod);
    // Mirror tiles — MeshBasicMaterial (no PBR cost), 900 tiles for full coverage
    const tileMat=new THREE.MeshBasicMaterial({color:0xe8f0ff});
    const TILES=900;
    const tileGeo=new THREE.BoxGeometry(0.118,0.118,0.018);
    const discoInst=new THREE.InstancedMesh(tileGeo,tileMat,TILES);
    const _dmmy=new THREE.Object3D();
    for(let i=0;i<TILES;i++){
      const phi=Math.acos(1-2*(i+0.5)/TILES);
      const theta=Math.PI*(1+Math.sqrt(5))*(i+0.5);
      const nx=Math.sin(phi)*Math.cos(theta), ny=Math.cos(phi), nz=Math.sin(phi)*Math.sin(theta);
      _dmmy.position.set(nx*1.07,ny*1.07,nz*1.07);
      _dmmy.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),new THREE.Vector3(nx,ny,nz));
      _dmmy.updateMatrix();
      discoInst.setMatrixAt(i,_dmmy.matrix);
    }
    discoInst.instanceMatrix.needsUpdate=true;
    db.add(discoInst);
    const discoLights=[];
    for(let i=0;i<4;i++){
      const pl=new THREE.PointLight(0xffffff,5,36); scene.add(pl); discoLights.push({pl,off:i/4});
    }

    /* ═══ DANCE FLOOR — GPU shader plane, zero per-frame CPU cost ═══ */
    const DFCOLS=14, DFROWS=6, TW=RW/DFCOLS, TD=2.2;
    const _dfShader=new THREE.ShaderMaterial({
      uniforms:{uTime:{value:0},uFlash:{value:0}},
      vertexShader:`varying vec2 vUv;
        void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`
        uniform float uTime;
        uniform float uFlash;
        varying vec2 vUv;
        vec3 hsl2rgb(float h,float s,float l){
          float c=(1.0-abs(2.0*l-1.0))*s;
          float x=c*(1.0-abs(mod(h*6.0,2.0)-1.0));
          float m=l-c/2.0;
          vec3 rgb;
          if(h<1.0/6.0)rgb=vec3(c,x,0.0);
          else if(h<2.0/6.0)rgb=vec3(x,c,0.0);
          else if(h<3.0/6.0)rgb=vec3(0.0,c,x);
          else if(h<4.0/6.0)rgb=vec3(0.0,x,c);
          else if(h<5.0/6.0)rgb=vec3(x,0.0,c);
          else rgb=vec3(c,0.0,x);
          return rgb+vec3(m);
        }
        void main(){
          float col=floor(vUv.x*14.0);
          float row=floor(vUv.y*6.0);
          float cx=fract(vUv.x*14.0);
          float cy=fract(vUv.y*6.0);
          float gap=0.05;
          if(cx<gap||cx>1.0-gap||cy<gap||cy>1.0-gap){
            gl_FragColor=vec4(0.04,0.04,0.04,1.0);return;
          }
          float wave=sin(col*0.6-uTime*3.5+row*0.4);
          float hue=mod(col*0.07+row*0.13+uTime*0.15,1.0);
          float bright=max(0.0,wave)*0.4+uFlash*0.3+0.38;
          gl_FragColor=vec4(hsl2rgb(hue,1.0,bright),1.0);
        }`
    });
    const _dfFloorW=RW-0.1, _dfFloorD=DFROWS*TD-0.1;
    const _dfPlane=new THREE.Mesh(new THREE.PlaneGeometry(_dfFloorW,_dfFloorD),_dfShader);
    _dfPlane.rotation.x=-Math.PI/2;
    _dfPlane.position.set(0,0.03,2+DFROWS*TD/2);
    scene.add(_dfPlane);

    /* ═══ PENNANT BANNER + streamers ═══ */
    (function(){
      // Pennant garland across room
      const PCOLS=[0x7BDFF2,0xB2F7EF,0xEFF7F6,0xF7D6E0,0xF2B5D4,0x7BDFF2,0xB2F7EF,0xF7D6E0];
      const BW=28, DROOP=1.4, BZ=8;
      // Drooping rope — catenary sag
      const ropePoints=[];
      for(let ri=0;ri<=50;ri++){
        const rt=ri/50;
        ropePoints.push(new THREE.Vector3(
          -BW/2+rt*BW,
          RH-0.5-Math.sin(rt*Math.PI)*DROOP,
          BZ
        ));
      }
      scene.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(ropePoints),
        new THREE.LineBasicMaterial({color:0xcc9922})
      ));

      // Lettered pennants — "HAPPY BIRTHDAY NANKY" spread across the droop
      const letters=['✦','H','A','P','P','Y',' ','B','I','R','T','H','D','A','Y',' ','N','A','N','K','Y','✦'];
      const NP=letters.length;
      for(let i=0;i<NP;i++){
        const rt=(i+0.5)/NP;
        const px=-BW/2+rt*BW;
        const py=RH-0.5-Math.sin(rt*Math.PI)*DROOP; // follows the droop
        const letter=letters[i].trim();
        const col=PCOLS[i%8];

        // Canvas: transparent bg + triangle fill + letter
        const C2=document.createElement('canvas'); C2.width=128; C2.height=170;
        const c2=C2.getContext('2d');
        c2.clearRect(0,0,128,170);
        // Triangle
        c2.fillStyle='#'+col.toString(16).padStart(6,'0');
        c2.beginPath(); c2.moveTo(2,2); c2.lineTo(126,2); c2.lineTo(64,168); c2.closePath(); c2.fill();
        // Subtle inner highlight
        c2.strokeStyle='rgba(255,255,255,0.35)'; c2.lineWidth=2.5;
        c2.beginPath(); c2.moveTo(2,2); c2.lineTo(126,2); c2.lineTo(64,168); c2.closePath(); c2.stroke();
        // Letter — white fill + dark outline for pop
        if(letter){
          c2.font='bold 72px "Bungee",Impact,sans-serif';
          c2.textAlign='center'; c2.textBaseline='top';
          c2.strokeStyle='rgba(0,0,0,0.7)'; c2.lineWidth=8; c2.lineJoin='round';
          c2.strokeText(letter,64,8);
          c2.shadowColor='rgba(0,0,0,0.5)'; c2.shadowBlur=4;
          c2.fillStyle='#ffffff';
          c2.fillText(letter,64,8);
          c2.shadowBlur=0;
        }
        const ptex=new THREE.CanvasTexture(C2); ptex.needsUpdate=true;
        const pnt=new THREE.Mesh(
          new THREE.PlaneGeometry(1.05,1.38),
          new THREE.MeshBasicMaterial({map:ptex,side:THREE.DoubleSide,transparent:true,alphaTest:0.05})
        );
        pnt.position.set(px, py-0.69, BZ);
        scene.add(pnt);
      }
      // Text below pennants
      // Soft ambient light for the banner area
      {const _bl=new THREE.PointLight(0x93E5AB,3,12); _bl.position.set(0,RH-0.2,BZ+1); scene.add(_bl);}

      // ── QUARTER CENTURY ARCADE sign (above, arcade style) ──
      (function(){
        const C2=document.createElement('canvas'); C2.width=1024; C2.height=160;
        const cx2=C2.getContext('2d');
        // Background with gradient
        const bgG=cx2.createLinearGradient(0,0,0,160);
        bgG.addColorStop(0,'#0a0020'); bgG.addColorStop(1,'#04000e');
        cx2.fillStyle=bgG; cx2.fillRect(0,0,1024,160);
        // Rainbow border
        const brd=cx2.createLinearGradient(0,0,1024,0);
        ['#ff3366','#ff8800','#ffee00','#44ff88','#00ccff','#cc44ff','#ff3366'].forEach((c,i)=>brd.addColorStop(i/6,c));
        cx2.strokeStyle=brd; cx2.lineWidth=5; cx2.strokeRect(4,4,1016,152);
        cx2.strokeStyle='rgba(255,255,255,0.08)'; cx2.lineWidth=12; cx2.strokeRect(4,4,1016,152);
        // Corner emojis
        ['🎉','🎂','🎊','⭐'].forEach((e,i)=>{
          cx2.font='28px serif'; cx2.textAlign='center'; cx2.textBaseline='middle';
          cx2.fillText(e,[48,976,48,976][i],[34,34,126,126][i]);
        });
        // Main text — Bungee with rainbow gradient
        const tg=cx2.createLinearGradient(80,0,944,0);
        tg.addColorStop(0,'#ff4488'); tg.addColorStop(0.2,'#ffcc00'); tg.addColorStop(0.4,'#44ff88');
        tg.addColorStop(0.6,'#44aaff'); tg.addColorStop(0.8,'#cc44ff'); tg.addColorStop(1,'#ff4488');
        cx2.shadowColor='rgba(200,100,255,0.7)'; cx2.shadowBlur=22;
        cx2.fillStyle=tg; cx2.font='bold 44px "Bungee","Impact",Arial,sans-serif';
        cx2.textAlign='center'; cx2.textBaseline='middle';
        cx2.fillText('QUARTER CENTURY ARCADE',512,65);
        cx2.shadowBlur=0;
        // Sub-text — fun & bright
        cx2.fillStyle='#ffee88'; cx2.font='bold 15px "Bungee","Impact",Arial,sans-serif';
        cx2.fillText('🎈  NANKY\'S 25TH  ·  EST. 2001  ·  25¢ PER PLAY  🎈',512,118);
        const tex2=new THREE.CanvasTexture(C2); tex2.needsUpdate=true;
        const sign=new THREE.Mesh(new THREE.PlaneGeometry(15,2.2),new THREE.MeshBasicMaterial({map:tex2}));
        sign.position.set(0,6.5,-RD/2+0.2); scene.add(sign);
        const sl=new THREE.PointLight(0x8833ff,4,14); sl.position.set(0,6.5,-RD/2+1.5); scene.add(sl);
      })();
    })();

    /* ═══ STREAMERS — thick coily TubeGeometry, like real paper streamers ═══ */
    (function(){
      const SCOLS=[0xff3355,0xffcc00,0x33ddaa,0x4488ff,0xcc33ff,0xff7722,0xff55aa,0x33ffcc];

      function addCoilyStreamer(x,z,col,phase,dropLen,curls,radius){
        const pts=[]; const N=60;
        for(let i=0;i<=N;i++){
          const t=i/N, ang=t*Math.PI*2*curls+phase;
          const cr=radius*(1-t*0.35);
          pts.push(new THREE.Vector3(x+Math.cos(ang)*cr, RH-0.1-t*dropLen, z+Math.sin(ang)*cr));
        }
        const curve=new THREE.CatmullRomCurve3(pts);
        // Flat ribbon cross-section (6 segments, small radius = papery look)
        const geo=new THREE.TubeGeometry(curve,60,0.038,5,false);
        const mat=new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide});
        scene.add(new THREE.Mesh(geo,mat));
      }

      // Dense field of streamers across whole room ceiling
      const spots=[
        [-12,4,0],[- 9,5,3],[-6,6,1],[-3,7,5],[0,0,8],[3,1,2],[6,2,6],[9,3,4],[12,4,7],
        [-11,5,10],[-7,6,0],[-4,7,9],[-1,0,3],[2,1,7],[5,2,1],[8,3,5],[11,4,8],
        [-10,5,0],[-5,6,4],[1,7,6],[4,0,2],[7,1,9],[10,2,3]
      ];
      spots.forEach(([x,ci,seed],i)=>{
        const zFront=2+Math.sin(i*1.3)*8;
        const zBack= -8+Math.cos(i*1.1)*6;
        addCoilyStreamer(x,zFront,SCOLS[ci%8], i*0.55, 2.5+Math.sin(i)*2, 3+i%4, 0.18+Math.sin(i*0.7)*0.10);
        addCoilyStreamer(x,zBack, SCOLS[(ci+3)%8], i*0.8+1.5, 3+Math.cos(i)*1.5, 2+i%5, 0.22+Math.cos(i*0.5)*0.08);
      });
    })();

    /* ═══ BIRTHDAY CAKE ═══ */
    (function(){
      const g=new THREE.Group();
      const cakeMat=(col)=>new THREE.MeshStandardMaterial({color:col,roughness:0.75,metalness:0.0});
      // Bottom tier
      const t1=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,0.72,32),cakeMat(0xff88bb));
      t1.position.set(0,0.36,0); g.add(t1);
      // Frosting blobs around top rim of bottom tier
      for(let i=0;i<14;i++){
        const a=i/14*Math.PI*2;
        const blob=new THREE.Mesh(new THREE.SphereGeometry(0.13,8,8),cakeMat(0xffffff));
        blob.position.set(Math.cos(a)*0.95,0.70,Math.sin(a)*0.95); g.add(blob);
      }
      // Top tier
      const t2=new THREE.Mesh(new THREE.CylinderGeometry(0.68,0.68,0.58,32),cakeMat(0xffcc44));
      t2.position.set(0,1.01,0); g.add(t2);
      // Top frosting disc
      const td=new THREE.Mesh(new THREE.CylinderGeometry(0.69,0.69,0.07,32),cakeMat(0xffffff));
      td.position.set(0,1.33,0); g.add(td);
      // Candles
      const CCAND=[0xff3366,0xff8800,0xffee00,0x44ff88,0x4488ff,0xcc44ff,0xff55aa];
      for(let i=0;i<7;i++){
        const a=i===0?0:((i-1)/6*Math.PI*2), r=i===0?0:0.40;
        const cndx=Math.cos(a)*r, cndz=Math.sin(a)*r;
        const candle=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.38,8),cakeMat(CCAND[i]));
        candle.position.set(cndx,1.52,cndz); g.add(candle);
        const flame=new THREE.Mesh(new THREE.SphereGeometry(0.065,8,8),new THREE.MeshBasicMaterial({color:0xffee88}));
        flame.scale.y=1.6; flame.position.set(cndx,1.74,cndz); g.add(flame);
        const fl=new THREE.PointLight(0xffcc55,1.4,2.2); fl.position.set(cndx,1.78,cndz); g.add(fl);
      }
      // Cake stand
      const stand=new THREE.Mesh(new THREE.CylinderGeometry(1.18,1.25,0.06,32),new THREE.MeshStandardMaterial({color:0xffffff,metalness:0.5,roughness:0.3}));
      stand.position.set(0,0.03,0); g.add(stand);
      g.position.set(6,0,6); scene.add(g);
      // Warm glow above cake
      const ck=new THREE.PointLight(0xffcc88,2.5,6); ck.position.set(6,3,6); scene.add(ck);
    })();

    /* ═══ HANGING STAR DECORATIONS ═══ */
    (function(){
      const starCols=[0xffee00,0xff44aa,0x44ffcc,0xff8822,0xcc44ff,0x44aaff,0xffcc00,0xff3366];
      const spots=[[-10,4],[-6,1],[0,-2],[6,0],[10,3],[-8,-6],[8,-5],[-3,7],[3,-8]];
      spots.forEach(([sx,sz],i)=>{
        // Draw a star on canvas
        const C=document.createElement('canvas'); C.width=128; C.height=128;
        const cx=C.getContext('2d');
        cx.clearRect(0,0,128,128);
        const col='#'+starCols[i%8].toString(16).padStart(6,'0');
        cx.fillStyle=col;
        cx.shadowColor=col; cx.shadowBlur=18;
        cx.beginPath();
        for(let p=0;p<10;p++){
          const a=p/10*Math.PI*2-Math.PI/2;
          const r=p%2===0?54:22;
          p===0?cx.moveTo(64+Math.cos(a)*r,64+Math.sin(a)*r):cx.lineTo(64+Math.cos(a)*r,64+Math.sin(a)*r);
        }
        cx.closePath(); cx.fill();
        const tex=new THREE.CanvasTexture(C); tex.needsUpdate=true;
        const sz2=0.55+Math.sin(i*1.3)*0.2;
        const star=new THREE.Mesh(new THREE.PlaneGeometry(sz2,sz2),
          new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:0.05,side:THREE.DoubleSide}));
        const hangY=RH-0.4-Math.sin(i*0.7)*0.6;
        star.position.set(sx,hangY,sz);
        scene.add(star);
        // Glow light under star
        const sl=new THREE.PointLight(starCols[i%8],1.2,4);
        sl.position.set(sx,hangY-0.3,sz); scene.add(sl);
        // Thin string from ceiling
        const sLine=new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(sx,RH,sz),new THREE.Vector3(sx,hangY+sz2/2,sz)]),
          new THREE.LineBasicMaterial({color:0xcccccc,transparent:true,opacity:0.4})
        );
        scene.add(sLine);
      });
    })();

    /* ═══ 3D CLAW MACHINE ═══ */
    (function(){
      const g=new THREE.Group();
      // Glass case
      g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(2.2,3.2,1.9),
        new THREE.MeshStandardMaterial({color:0x334466,metalness:0.4,roughness:0.6})),{}));
      // Glass front
      const gls=new THREE.Mesh(new THREE.BoxGeometry(2.0,2.4,0.06),
        new THREE.MeshStandardMaterial({color:0x99ccff,transparent:true,opacity:0.22,metalness:0.1,roughness:0.0}));
      gls.position.set(0,0.2,0.97); g.add(gls);
      // LED header

    function curlyString(r,phase){
      const pts=[]; const sLen=3.2+r*2.0;
      for(let i=0;i<=32;i++){
        const u=i/32, ang=u*Math.PI*7+phase, curl=0.14*(1-u*0.6);
        pts.push(new THREE.Vector3(Math.cos(ang)*curl, -r*1.1-u*sLen, Math.sin(ang)*curl));
      }
      return new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.5})
      );
    }

    function addHeliumBalloon(x,y,z,col,r,phase){
      const g=new THREE.Group();
      const body=new THREE.Mesh(new THREE.SphereGeometry(r,16,16),
        new THREE.MeshStandardMaterial({color:col,metalness:0.75,roughness:0.12,emissive:col,emissiveIntensity:0.18}));
      body.scale.y=1.2; g.add(body);
      const knot=new THREE.Mesh(new THREE.SphereGeometry(r*0.11,6,6),
        new THREE.MeshStandardMaterial({color:col,metalness:0.5,roughness:0.3}));
      knot.position.y=-r*1.22; g.add(knot);
      g.add(curlyString(r,phase));
      const pt=new THREE.PointLight(col,r*1.8,r*6); g.add(pt);
      g.position.set(x,y,z);
      g.userData={baseY:y,phase,r};
      scene.add(g); balloons.push(g);
    }

        });
        // turbulence zones
        cx.fillStyle='rgba(200,70,10,0.55)';
        cx.fillRect(180,30,40,90); cx.fillRect(30,100,35,80);
        cx.fillStyle='rgba(255,220,40,0.7)';
        cx.font='bold 20px sans-serif'; cx.textAlign='center';
        cx.fillText('⚡',200,80); cx.fillText('⚡',47,145);
        // plane
        cx.fillStyle='#f4f6fb';
        cx.beginPath(); cx.ellipse(128,130,50,16,0,0,Math.PI*2); cx.fill();
        cx.fillStyle='#1565c0'; cx.fillRect(115,122,26,8);
        cx.beginPath(); cx.moveTo(165,130); cx.quadraticCurveTo(180,130,170,140); cx.closePath(); cx.fill();
        cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(0,0,256,32);
        cx.fillStyle='#fff'; cx.font='bold 12px monospace'; cx.textAlign='center';
        cx.fillText('FEAR OF FLYING',128,22);

      } else if (idx === 2) {
        // Wheeler Climb — night brick building + fire escape
        cx.fillStyle='#020810'; cx.fillRect(0,0,256,200);
        // stars
        [[20,18],[80,10],[150,25],[200,15],[230,40],[50,40],[120,8]].forEach(([x,y])=>{
          cx.fillStyle='rgba(255,255,220,0.7)'; cx.fillRect(x,y,2,2);
        });
        // building
        const brickPal=['#9a3c28','#8b3320','#a04030'];
        for(let r=0;r<8;r++){
          for(let c=0;c<7;c++){
            cx.fillStyle=brickPal[(r*3+c)%3];
            const bx=20+(c*(30+(r%2?0:15)))+((r%2)*15);
            const by=70+r*16;
            if(bx<236) cx.fillRect(bx,by,28,13);
          }
        }
        // windows
        [[50,80],[100,80],[150,80],[50,110],[100,110],[150,110]].forEach(([x,y])=>{
          cx.fillStyle='rgba(255,220,100,0.7)'; cx.fillRect(x,y,22,18);
          cx.strokeStyle='#c8b090'; cx.lineWidth=1; cx.strokeRect(x,y,22,18);
        });
        // fire escape
        cx.strokeStyle='#1a1a1a'; cx.lineWidth=3;
        cx.beginPath(); cx.moveTo(185,70); cx.lineTo(185,200); cx.stroke();
        cx.beginPath(); cx.moveTo(200,70); cx.lineTo(200,200); cx.stroke();
        for(let i=0;i<8;i++){ cx.beginPath(); cx.moveTo(185,78+i*16); cx.lineTo(200,78+i*16); cx.stroke(); }
        cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(0,0,256,32);
        cx.fillStyle='#f4d03f'; cx.font='bold 11px monospace'; cx.textAlign='center';
        cx.fillText('CLIMBING UP WHEELER',128,22);

      } else if (idx === 3) {
        // Flute Face-Off — whack-a-mole holes on dark background
        cx.fillStyle='#070e07'; cx.fillRect(0,0,256,200);
        // musical notes
        cx.fillStyle='rgba(0,180,80,0.08)'; cx.font='18px serif'; cx.textAlign='left';
        ['♩','♪','♫','♬'].forEach((n,i)=>cx.fillText(n,20+i*58,28));
        // draw 9 holes in 3x3
        const hxs=[56,128,200], hys=[70,120,170];
        hxs.forEach(hx=>hys.forEach(hy=>{
          // outer rim
          const rim=cx.createRadialGradient(hx-3,hy-3,14,hx,hy,26);
          rim.addColorStop(0,'#ccc'); rim.addColorStop(0.6,'#888'); rim.addColorStop(1,'#333');
          cx.beginPath(); cx.arc(hx,hy,26,0,Math.PI*2); cx.fillStyle=rim; cx.fill();
          // dark hole
          const hole=cx.createRadialGradient(hx,hy-4,0,hx,hy,20);
          hole.addColorStop(0,'#1a1a1a'); hole.addColorStop(1,'#040404');
          cx.beginPath(); cx.arc(hx,hy,20,0,Math.PI*2); cx.fillStyle=hole; cx.fill();
        }));
        // a face peeking from center hole
        cx.save();
        cx.beginPath(); cx.arc(128,120,20,0,Math.PI*2); cx.clip();
        cx.fillStyle='#ffcc88'; cx.fillRect(108,108,40,32);
        cx.fillStyle='#222'; cx.beginPath(); cx.arc(120,116,3,0,Math.PI*2); cx.fill();
        cx.beginPath(); cx.arc(136,116,3,0,Math.PI*2); cx.fill();
        cx.strokeStyle='#222'; cx.lineWidth=2; cx.beginPath();
        cx.arc(128,122,6,0.1,Math.PI-0.1); cx.stroke();
        cx.restore();
        cx.fillStyle='rgba(0,0,0,.5)'; cx.fillRect(0,0,256,32);
        cx.fillStyle='#00ff88'; cx.font='bold 11px monospace'; cx.textAlign='center';
        cx.fillText('FLUTE FACE-OFF',128,22);

      } else {
        // Shoe Shuffle — mini shoe rack
        cx.fillStyle='#12040e'; cx.fillRect(0,0,256,200);
        // rack frame
        cx.fillStyle='#1e0818';
        cx.beginPath(); cx.roundRect(14,34,228,140,6); cx.fill();
        cx.strokeStyle='#4a1840'; cx.lineWidth=2; cx.stroke();
        // shelf planks
        const shelfColors=['#5a3520','#3d2414'];
        [94,154].forEach((sy,ri)=>{
          const g2=cx.createLinearGradient(0,sy,0,sy+8);
          g2.addColorStop(0,shelfColors[0]); g2.addColorStop(1,shelfColors[1]);
          cx.fillStyle=g2; cx.fillRect(18,sy,220,8);
        });
        // shoe slots — 2 rows × 6 cols
        const shoeColors=['#ff88cc','#ffaadd','#cc66aa','#ff55bb','#dd4499','#ffbbee',
                          '#aa3388','#ff99cc','#cc4488','#ff66aa','#dd77bb','#ff44aa'];
        for(let row=0;row<2;row++){
          for(let col=0;col<6;col++){
            const sx=22+col*37, sy=44+row*58, sw=32, sh=46;
            cx.fillStyle='#200a14'; cx.fillRect(sx,sy,sw,sh);
            const c=shoeColors[row*6+col];
            cx.fillStyle=c; cx.globalAlpha=0.7;
            cx.fillRect(sx+3,sy+8,sw-6,sh-14);
            cx.globalAlpha=1;
          }
        }
        cx.fillStyle='rgba(0,0,0,.5)'; cx.fillRect(0,0,256,32);
        cx.fillStyle='#ff55bb'; cx.font='bold 11px monospace'; cx.textAlign='center';
        cx.fillText('SHOE SHUFFLE',128,22);
      }

      return new THREE.CanvasTexture(C);
    }

    /* ════════════════════════════════════════════════════
       5 GAME MACHINES — position + game data bundled together
       ════════════════════════════════════════════════════ */
    const GAME_DATA = [
      {url:'game/index.html',  name:'SHEEP ESCAPE',      x:-8.5, z:-3,  body:0x0e2a0c, screen:0x22ee55, marq:0x1a6620, accent:0x44ff88},
      {url:'game2/index.html', name:'FEAR OF FLYING',    x:-4.0, z:-6,  body:0x081830, screen:0x2299ff, marq:0x0a3060, accent:0x55aaff},
      {url:'game3/index.html', name:'WHEELER CLIMB',     x: 0.0, z:-7,  body:0x2a0a04, screen:0xff4422, marq:0x601808, accent:0xff6644},
      {url:'game4/index-v2.html', name:'FLUTE FACE-OFF',  x: 4.0, z:-6,  body:0x1a2e1e, screen:0x00ff88, marq:0x0a2010, accent:0x44ffaa},
      {url:'game5/index.html', name:'SHOE SHUFFLE',       x: 8.5, z:-3,  body:0x1c0818, screen:0xff55bb, marq:0x500030, accent:0xffaadd},
    ];

    function addGameMachine({x,z,body,screen,marq,accent}, idx) {
      const g=new THREE.Group(), W=1.3, H=3.0, D=0.72;

      [-W/2-0.02,W/2+0.02].forEach(sx=>{
        const side=new THREE.Mesh(new THREE.BoxGeometry(0.06,H,D+0.04),
          new THREE.MeshLambertMaterial({color:body}));
        side.position.set(sx,0,0);  // fixed: use .set() not Object.assign
        g.add(side);
        const stripe=new THREE.Mesh(new THREE.BoxGeometry(0.02,H*0.55,0.02),
          new THREE.MeshBasicMaterial({color:accent}));
        stripe.position.set(sx,H*0.1,0); g.add(stripe);
      });

      const cab=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),
        new THREE.MeshLambertMaterial({color:body}));
      cab.castShadow=true; cab.receiveShadow=true; g.add(cab);

      const mq=new THREE.Mesh(new THREE.BoxGeometry(W*0.95,H*0.14,0.06),
        new THREE.MeshBasicMaterial({color:marq}));
      mq.position.set(0,H*0.43,D/2+0.01); g.add(mq);
      const ml=new THREE.PointLight(screen,1.2,3);
      ml.position.set(0,H*0.43,D/2+0.5); g.add(ml);

      const bezel=new THREE.Mesh(new THREE.BoxGeometry(W*0.88,H*0.40,0.04),
        new THREE.MeshLambertMaterial({color:0x050510}));
      bezel.position.set(0,H*0.10,D/2+0.025); g.add(bezel);

      const scrTex = makeScreenTexture(idx);
      scrTex.needsUpdate = true;
      const scrMesh=new THREE.Mesh(new THREE.PlaneGeometry(W*0.76,H*0.34),
        new THREE.MeshBasicMaterial({map:scrTex, side:THREE.FrontSide}));
      scrMesh.position.set(0,H*0.10,D/2+0.06); g.add(scrMesh); // in front of bezel
      const sl=new THREE.PointLight(screen,2.2,5);
      sl.position.set(0,H*0.10,D/2+0.6); g.add(sl);

      const grille=new THREE.Mesh(new THREE.BoxGeometry(W*0.55,H*0.07,0.02),
        new THREE.MeshLambertMaterial({color:0x0a0820}));
      grille.position.set(0,H*0.35,D/2+0.01); g.add(grille);

      const cp=new THREE.Mesh(new THREE.BoxGeometry(W*0.90,H*0.09,D*0.45),
        new THREE.MeshLambertMaterial({color:0x0e0c22}));
      cp.rotation.x=-0.35; cp.position.set(0,-H*0.26,D*0.38); g.add(cp);

      // Coin slot (the interactive bit)
      const coinSlot=new THREE.Mesh(new THREE.BoxGeometry(W*0.26,0.03,0.03),
        new THREE.MeshBasicMaterial({color:0x060618}));
      coinSlot.position.set(0,-H*0.37,D/2+0.025); g.add(coinSlot);

      const kick=new THREE.Mesh(new THREE.BoxGeometry(W,H*0.05,D+0.02),
        new THREE.MeshBasicMaterial({color:accent}));
      kick.position.set(0,-H*0.485,0); g.add(kick);

      g.position.set(x, H/2, z);
      scene.add(g);
    }
    GAME_DATA.forEach((g,i) => addGameMachine(g,i));

    /* ════════════════════════════════════════════════════
       COIN SYSTEM
       ════════════════════════════════════════════════════ */

    // Extra interactive machines (not game cabinets)
    const EXTRAS = [
      {x:-12, z:-8, name:'PRIZE CLAW', url:'claw/index.html'},
    ];
    const ALL_MACHINES = [...GAME_DATA, ...EXTRAS];

    let coins = 5;
    let nearIdx = -1;

    // Lazy getters — elements are added AFTER this script tag in the DOM
    const el = id => document.getElementById(id);

    function updateCoinDisplay() {
      const n = el('coin-count-num'); if(n) n.textContent = coins;
      const b = el('prompt-btn');     if(b) b.disabled = (coins <= 0);
      const x = el('prompt-no-coins');if(x) x.style.display = coins <= 0 ? 'block' : 'none';
    }

    function checkProximity() {
      let closest=-1, closestDist=Infinity;
      ALL_MACHINES.forEach((g,i)=>{
        const dx=camera.position.x-g.x, dz=camera.position.z-g.z;
        const d=Math.sqrt(dx*dx+dz*dz);
        if(d<5.5 && d<closestDist){ closest=i; closestDist=d; }
      });
      if(closest===nearIdx) return;
      nearIdx=closest;
      const promptEl = el('machine-prompt');
      if(!promptEl) return;
      if(closest<0){
        promptEl.classList.remove('visible');
      } else {
        const g=ALL_MACHINES[closest];
        const pn=el('prompt-game-name'); if(pn) pn.textContent=g.name;
        const ps=el('prompt-sub');       if(ps) ps.textContent=g.url?'Press [E] or click to play':'Not yet available';
        updateCoinDisplay();
        promptEl.classList.add('visible');
      }
    }

    function insertCoin() {
      if(nearIdx<0) return;
      const g=ALL_MACHINES[nearIdx];
      if(!g.url){ flashMessage('COMING SOON!'); return; }
      if(coins<=0){ flashMessage('NO QUARTERS!'); return; }

      coins--;
      updateCoinDisplay();

      const fadeEl=el('coin-fade'), overlayEl=el('game-overlay'), frameEl=el('game-frame');
      if(fadeEl) fadeEl.classList.add('fading');
      setTimeout(()=>{
        if(overlayEl) overlayEl.classList.add('active');
        if(frameEl)   frameEl.src=g.url;
        setTimeout(()=>{ if(fadeEl) fadeEl.classList.remove('fading'); }, 300);
      }, 350);
    }

    function exitGame() {
      const fadeEl=el('coin-fade'), overlayEl=el('game-overlay'), frameEl=el('game-frame');
      if(fadeEl) fadeEl.classList.add('fading');
      setTimeout(()=>{
        if(overlayEl) overlayEl.classList.remove('active');
        if(frameEl)   frameEl.src='';
        setTimeout(()=>{ if(fadeEl) fadeEl.classList.remove('fading'); }, 300);
      }, 350);
    }

    function flashMessage(msg) {
      const promptNone=el('prompt-no-coins');
      if(!promptNone) return;
      promptNone.textContent=msg; promptNone.style.display='block';
      setTimeout(()=>{ promptNone.style.display='none'; }, 2000);
    }

    // Wire up buttons after DOM is fully ready
    window.addEventListener('DOMContentLoaded', ()=>{
      const pb=el('prompt-btn'); if(pb) pb.addEventListener('click', insertCoin);
      const eb=el('exit-game-btn'); if(eb) eb.addEventListener('click', exitGame);
      const fr=el('game-frame');
    });
    // Also wire immediately in case DOMContentLoaded already fired
    setTimeout(()=>{
      const pb=el('prompt-btn'); if(pb && !pb._wired){ pb.addEventListener('click',insertCoin); pb._wired=true; }
      const eb=el('exit-game-btn'); if(eb && !eb._wired){ eb.addEventListener('click',exitGame); eb._wired=true; }
    }, 200);

    /* ── Camera controls ── */
    let rotY=0, rotX=0, drag=false, lx=0, ly=0;
    const keys={};

    function applyRot(){ camera.rotation.order='YXZ'; camera.rotation.y=rotY; camera.rotation.x=rotX; }

    canvas.style.cursor='grab';
    canvas.addEventListener('mousedown',e=>{ if(e.target!==canvas)return; drag=true; lx=e.clientX; ly=e.clientY; canvas.style.cursor='grabbing'; });
    window.addEventListener('mouseup',()=>{ drag=false; canvas.style.cursor='grab'; });
    window.addEventListener('mousemove',e=>{ if(!drag)return; rotY-=(e.clientX-lx)*0.004; rotX=Math.max(-0.7,Math.min(0.6,rotX-(e.clientY-ly)*0.003)); lx=e.clientX; ly=e.clientY; applyRot(); });

    canvas.addEventListener('touchstart',e=>{ lx=e.touches[0].clientX; ly=e.touches[0].clientY; },{passive:true});
    canvas.addEventListener('touchmove',e=>{ e.preventDefault(); rotY-=(e.touches[0].clientX-lx)*0.004; rotX=Math.max(-0.7,Math.min(0.6,rotX-(e.touches[0].clientY-ly)*0.003)); lx=e.touches[0].clientX; ly=e.touches[0].clientY; applyRot(); },{passive:false});

    window.addEventListener('keydown',e=>{
      keys[e.key]=true;
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) e.preventDefault();
      if(e.key==='e'||e.key==='E') insertCoin();
      if(e.key==='Escape'){ const ov=el('game-overlay'); if(ov&&ov.classList.contains('active')) exitGame(); }
    });
    window.addEventListener('keyup',e=>keys[e.key]=false);

    const SPEED=6.0; // units per second
    function handleMovement(dt){
      const _ov=el('game-overlay'); if(_ov&&_ov.classList.contains('active')) return; // freeze while game is open
      const step=SPEED*dt;
      const fwd=new THREE.Vector3(-Math.sin(rotY),0,-Math.cos(rotY));
      const rgt=new THREE.Vector3( Math.cos(rotY),0,-Math.sin(rotY));
      if(keys['w']||keys['W']) camera.position.addScaledVector(fwd, step);
      if(keys['s']||keys['S']) camera.position.addScaledVector(fwd,-step);
      if(keys['a']||keys['A']) camera.position.addScaledVector(rgt,-step);
      if(keys['d']||keys['D']) camera.position.addScaledVector(rgt, step);
      if(keys['ArrowLeft'])  rotY+=1.5*dt;
      if(keys['ArrowRight']) rotY-=1.5*dt;
      if(keys['ArrowUp'])    rotX=Math.max(-0.7,Math.min(0.6,rotX+1.1*dt));
      if(keys['ArrowDown'])  rotX=Math.max(-0.7,Math.min(0.6,rotX-1.1*dt));
      applyRot();
      camera.position.x=Math.max(-RW/2+1,Math.min(RW/2-1,camera.position.x));
      camera.position.z=Math.max(-RD/2+1,Math.min(RD/2-1,camera.position.z));
      camera.position.y=2.5;
    }

    window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

    // Controls hint
    const hint=document.createElement('div');
    hint.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;color:rgba(190,160,255,.55);font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:2px;pointer-events:none;white-space:nowrap;';
    hint.innerHTML='WASD walk &nbsp;|&nbsp; DRAG / ← → ↑ ↓ look &nbsp;|&nbsp; [E] insert coin';
    document.body.appendChild(hint);
    setTimeout(()=>{ hint.style.transition='opacity 2s'; hint.style.opacity='0'; },10000);

    let t=0, lastNow=performance.now(), frameCount=0;
    (function loop(now){
      requestAnimationFrame(loop);
      const dt=Math.min((now-lastNow)/1000, 0.05); lastNow=now;
      t+=dt; frameCount++;
      handleMovement(dt);
      checkProximity();  // every frame so prompt appears even when standing still
      // Giant disco ball spin + 6 sweeping coloured lights
      db.rotation.y=t*1.1;
      const flash=Math.max(0,Math.sin(t*4)>0.96?1.0:0.0);

      discoLights.forEach(({pl,off},i)=>{
        const a=t*0.9+off*Math.PI*2;
        const sr=12+Math.sin(t*0.3+i)*4;
        pl.position.set(Math.sin(a)*sr, RH-1.8+Math.sin(t*0.7+i)*0.8, Math.cos(a)*sr);
        pl.color.setHSL((t*0.09+off)%1,1,0.7);
        pl.intensity=3.5+flash*5;
      });
      // Dance floor — GPU shader, just update two uniforms
      _dfShader.uniforms.uTime.value=t;
      _dfShader.uniforms.uFlash.value=flash;
      // Balloons bob + slow sway
      balloons.forEach(b=>{
        b.position.y=b.userData.baseY+Math.sin(t*0.85+b.userData.phase)*0.20;
        b.rotation.z=Math.sin(t*0.4+b.userData.phase)*0.05;
      });
      // Confetti falling and spinning
      confetti.forEach(c=>{
        c.position.x+=c.userData.vx; c.position.y+=c.userData.vy; c.position.z+=c.userData.vz;
        c.rotation.x+=c.userData.rx; c.rotation.z+=c.userData.rz;
        if(c.position.y<-0.2){ c.position.y=RH; c.position.x=(Math.random()-0.5)*RW*0.9; c.position.z=(Math.random()-0.5)*RD*0.9; }
      });
      renderer.render(scene,camera);
    })();
  })();
  </script>



  <!-- ══ COIN BAR ══ -->
  <div id="coin-bar">
    <div id="arcade-room-label">QUARTER CENTURY ARCADE</div>
    <div id="coin-display">
      <div class="hud-coin">25¢</div>
      <span id="coin-count-num">5</span>
      <span id="coin-label">QUARTERS</span>
    </div>
  </div>

  <!-- ══ MACHINE PROXIMITY PROMPT ══ -->
  <div id="machine-prompt">
    <div id="prompt-game-name">SHEEP ESCAPE</div>
    <div id="prompt-sub">Walk up to the machine</div>
    <button id="prompt-btn">INSERT QUARTER [E]</button>
    <div id="prompt-no-coins">NO QUARTERS LEFT!</div>
  </div>

  <!-- ══ FADE OVERLAY (coin insert transition) ══ -->
  <div id="coin-fade"></div>

  <!-- ══ GAME OVERLAY (fullscreen iframe) ══ -->
  <div id="game-overlay">
    <iframe id="game-frame" src="" allowfullscreen></iframe>
    <button id="exit-game-btn">← BACK TO ARCADE</button>
  </div>

</body>
</html>
